services:
    rabbit:
        image: rabbitmq:3-management
        restart: always
        ports:
            - "15672:15672"
            - "5672:5672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 15s
    db:
        image: postgres:alpine
        restart: always
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5433:5432"
        volumes:
            - pg_data:/var/lib/postgresql
            - ./sql-scripts:/docker-entrypoint-initdb.d/
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5

    fastapi:
        build: ./API_SCHEMAS
        restart: always
        working_dir: /app
        ports:
            - "8000:8000"
        environment:
            - PYTHONPATH=/app
        env_file:
            - API_SCHEMAS/api.env
        command: sh -c "uv sync --frozen && uv run alembic upgrade head && uv run python -m uvicorn main:app --host 0.0.0.0 --port 8000"
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=2)",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 5s
        depends_on:
            rabbit:
                condition: service_healthy
            db:
                condition: service_healthy

    checker:
        build: ./checker
        restart: always
        working_dir: /app
        environment:
            - PYTHONPATH=/app
        command: sh -c "uv sync && uv run alembic upgrade head && uv run python -m check"
        depends_on:
            rabbit:
                condition: service_healthy
            db:
                condition: service_healthy

    sendler:
        build: ./sendler
        restart: always
        environment:
            - PYTHONDONTWRITEBYTECODE=1
            - PYTHONUNBUFFERED=1
            - UV_PROJECT_ENVIRONMENT=/app/.venv
        command: sh -c "uv sync && uv run python -m faststream run sendler:app"
        depends_on:
            rabbit:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        restart: always
        ports:
            - 443:443
        volumes:
            - ./1nginx.conf:/etc/nginx/nginx.conf:ro
            - ./server.crt:/etc/ssl/certs/server.crt
            - ./server.key:/etc/ssl/private/server.key


        depends_on:
            fastapi:
                condition: service_healthy

volumes:
    pg_data:
